<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype Frontend OCR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        .upload-section { margin: 2rem 0; text-align: center; }
        button {
            background-color: #0066cc; color: white; border: none;
            padding: 0.8rem 1.5rem; font-size: 1rem; border-radius: 4px;
            cursor: pointer; margin-top: 1rem;
        }
        button:hover { background-color: #0052a3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .result-section { margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #eee; }
        pre { background: #f8f9fa; padding: 1rem; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word;}
        .loading { text-align: center; color: #666; font-style: italic; display: none; }
    </style>
</head>
<body>
    <h1>Uji Coba API OCR</h1>
    
    <div class="upload-section">
        <form id="ocrForm">
            <input type="file" id="imageInput" accept=".jpg, .jpeg, .png" required>
            <br>
            <button type="submit" id="submitBtn">Kirim ke Backend</button>
        </form>
    </div>

    <div class="loading" id="loadingIndicator">Memproses gambar (bisa memakan waktu beberapa detik)...</div>

    <div class="result-section" id="resultSection" style="display: none;">
        <h2>Hasil Ekstraksi (JSON):</h2>
        <pre id="jsonOutput"></pre>
    </div>

    <script>
        document.getElementById('ocrForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('imageInput');
            const submitBtn = document.getElementById('submitBtn');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const resultSection = document.getElementById('resultSection');
            const jsonOutput = document.getElementById('jsonOutput');

            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file); // 'file' adalah key yang ditangkap backend

            // UI State
            submitBtn.disabled = true;
            loadingIndicator.style.display = 'block';
            resultSection.style.display = 'none';
            jsonOutput.textContent = '';

            try {
                // Memanggil API Backend (pastikan python ocr_app.py sedang berjalan)
                const response = await fetch('http://127.0.0.1:3000/api/v1/ocr', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Terjadi kesalahan server');
                }

                // Tampilkan hasil sukses
                jsonOutput.style.color = '#333';
                jsonOutput.textContent = JSON.stringify(data, null, 2);
                
            } catch (error) {
                // Tampilkan error
                jsonOutput.style.color = 'red';
                jsonOutput.textContent = `Error: ${error.message}`;
            } finally {
                // Kembalikan UI State
                submitBtn.disabled = false;
                loadingIndicator.style.display = 'none';
                resultSection.style.display = 'block';
            }
        });
    </script>
</body>
</html>
