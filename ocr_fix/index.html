<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt OCR AI</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Inter, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, #3b82f6 0, transparent 35%),
          radial-gradient(circle at bottom right, #22c55e 0, transparent 30%),
          #0f172a;
        color: #e5e7eb;
        padding: 40px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
      }

      .header {
        text-align: center;
        margin-bottom: 35px;
      }

      .header h1 {
        font-size: 44px;
        margin: 0;
        letter-spacing: -1px;
      }

      .header p {
        color: #94a3b8;
        margin-top: 10px;
        font-size: 16px;
      }

      .card {
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 26px;
        backdrop-filter: blur(18px);
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1.3fr;
        gap: 24px;
      }

      .upload-box {
        border: 2px dashed rgba(148, 163, 184, 0.5);
        border-radius: 22px;
        min-height: 340px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        cursor: pointer;
        transition: 0.25s;
        background: rgba(255, 255, 255, 0.03);
      }

      .upload-box:hover {
        border-color: #38bdf8;
        background: rgba(56, 189, 248, 0.08);
        transform: translateY(-2px);
      }

      .upload-box input {
        display: none;
      }

      .upload-icon {
        font-size: 60px;
        margin-bottom: 14px;
      }

      .preview {
        width: 100%;
        max-height: 330px;
        object-fit: contain;
        border-radius: 18px;
        display: none;
      }

      .btn {
        width: 100%;
        margin-top: 18px;
        padding: 15px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #38bdf8, #22c55e);
        color: #020617;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.25s;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 40px rgba(34, 197, 94, 0.25);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .badge {
        padding: 7px 12px;
        background: rgba(34, 197, 94, 0.16);
        color: #86efac;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
      }

      .total-box {
        background: linear-gradient(
          135deg,
          rgba(56, 189, 248, 0.16),
          rgba(34, 197, 94, 0.16)
        );
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 20px;
      }

      .total-label {
        color: #94a3b8;
        font-size: 14px;
      }

      .total-value {
        font-size: 34px;
        font-weight: 900;
        margin-top: 6px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 16px;
      }

      th,
      td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      th {
        color: #93c5fd;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        background: rgba(255, 255, 255, 0.04);
      }

      td {
        color: #e5e7eb;
      }

      .empty {
        text-align: center;
        color: #94a3b8;
        padding: 70px 20px;
        border: 1px dashed rgba(148, 163, 184, 0.25);
        border-radius: 20px;
      }

      details {
        margin-top: 20px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 16px;
        padding: 14px 16px;
      }

      summary {
        cursor: pointer;
        font-weight: 700;
        color: #bfdbfe;
      }

      pre {
        white-space: pre-wrap;
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.6;
      }

      .loader {
        display: none;
        margin: 25px auto;
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 600px) {
        body {
          padding: 12px;
          overflow-x: hidden;
        }

        .container {
          width: 100%;
          max-width: 100%;
        }

        .grid {
          display: flex;
          flex-direction: column;
          gap: 18px;
        }

        .card {
          width: 100%;
          padding: 16px;
          border-radius: 22px;
          overflow: hidden;
        }

        .header {
          margin-bottom: 18px;
          text-align: center;
        }

        .header h1 {
          font-size: 38px;
          line-height: 1.1;
        }

        .header p {
          font-size: 15px;
          line-height: 1.5;
        }

        .upload-box {
          width: 100%;
          min-height: 220px;
          padding: 16px;
          border-radius: 18px;
        }

        .upload-icon {
          font-size: 48px;
        }

        .upload-box h2 {
          font-size: 24px;
          margin: 10px 0;
        }

        .preview {
          width: 100%;
          max-width: 100%;
          max-height: 240px;
          object-fit: contain;
          border-radius: 14px;
        }

        .btn {
          width: 100%;
          padding: 15px;
          font-size: 16px;
          border-radius: 16px;
        }

        .result-header {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
          margin-top: 10px;
          margin-bottom: 16px;
        }

        .result-header h2 {
          font-size: 32px;
          margin: 0;
        }

        .badge {
          align-self: flex-start;
          font-size: 13px;
          padding: 7px 14px;
        }

        .total-box {
          padding: 18px;
          border-radius: 18px;
          margin-bottom: 18px;
        }

        .total-label {
          font-size: 14px;
        }

        .total-value {
          font-size: 38px;
          line-height: 1.1;
          word-break: break-word;
        }

        table {
          width: 100%;
          table-layout: fixed;
          border-collapse: collapse;
          white-space: normal;
        }

        th,
        td {
          padding: 12px 8px;
          font-size: 13px;
          vertical-align: top;
        }

        th:nth-child(1),
        td:nth-child(1) {
          width: 55%;
          word-break: break-word;
        }

        th:nth-child(2),
        td:nth-child(2) {
          width: 15%;
          text-align: center;
        }

        th:nth-child(3),
        td:nth-child(3) {
          width: 30%;
          text-align: right;
          white-space: nowrap;
        }

        details {
          margin-top: 14px;
          border-radius: 16px;
          overflow: hidden;
        }

        summary {
          font-size: 15px;
        }

        pre {
          font-size: 12px;
          line-height: 1.5;
          overflow-x: auto;
        }

        .empty {
          padding: 40px 18px;
          font-size: 14px;
          border-radius: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Receipt OCR AI</h1>
        <p>
          Upload struk, ekstrak item belanja, total harga, dan raw OCR text.
        </p>
      </div>

      <div class="card grid">
        <div>
          <label class="upload-box" for="fileInput">
            <div id="uploadContent">
              <div class="upload-icon">🧾</div>
              <h2>Drop / Upload Receipt</h2>
              <p style="color: #94a3b8">Support JPG, JPEG, PNG</p>
            </div>

            <img id="preview" class="preview" />
            <input type="file" id="fileInput" accept="image/*" />
          </label>

          <button id="uploadBtn" class="btn" onclick="uploadReceipt()">
            Analyze Receipt
          </button>
        </div>

        <div>
          <div class="result-header">
            <h2 style="margin: 0">OCR Result</h2>
            <span class="badge" id="statusBadge">Waiting</span>
          </div>

          <div class="loader" id="loader"></div>

          <div id="emptyState" class="empty">
            Belum ada hasil. Upload struk dulu, bro.
          </div>

          <div id="resultArea" style="display: none">
            <div class="total-box">
              <div class="total-label">Total Belanja</div>
              <div class="total-value" id="totalBelanja">Rp 0</div>
            </div>

            <table>
              <thead>
                <tr>
                  <th>Nama Barang</th>
                  <th>Qty</th>
                  <th>Harga</th>
                </tr>
              </thead>
              <tbody id="itemsTable"></tbody>
            </table>

            <details>
              <summary>Raw OCR Text</summary>
              <pre id="rawText"></pre>
            </details>

            <details>
              <summary>Classification Text</summary>
              <pre id="classificationText"></pre>
            </details>
          </div>
        </div>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const preview = document.getElementById("preview");
      const uploadContent = document.getElementById("uploadContent");
      const loader = document.getElementById("loader");
      const emptyState = document.getElementById("emptyState");
      const resultArea = document.getElementById("resultArea");
      const statusBadge = document.getElementById("statusBadge");
      const uploadBtn = document.getElementById("uploadBtn");

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];

        if (!file) return;

        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        uploadContent.style.display = "none";
        statusBadge.textContent = "Ready";
      });

      function formatRupiah(number) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0,
        }).format(number || 0);
      }

      async function uploadReceipt() {
        const file = fileInput.files[0];

        if (!file) {
          alert("Pilih gambar struk dulu.");
          return;
        }

        const formData = new FormData();
        formData.append("file", file);

        loader.style.display = "block";
        emptyState.style.display = "none";
        resultArea.style.display = "none";
        statusBadge.textContent = "Processing";
        uploadBtn.disabled = true;

        try {
          const response = await fetch(
            "https://dart-deport-riot.ngrok-free.dev/ocr/receipt",
            {
              method: "POST",
              body: formData,
            },
          );

          if (!response.ok) {
            throw new Error("API error: " + response.status);
          }

          const data = await response.json();

          document.getElementById("totalBelanja").textContent = formatRupiah(
            data.total_belanja,
          );

          const table = document.getElementById("itemsTable");
          table.innerHTML = "";

          if (data.items && data.items.length > 0) {
            data.items.forEach((item) => {
              const row = document.createElement("tr");

              row.innerHTML = `
              <td>${item.nama_barang}</td>
              <td>${item.jumlah_barang}</td>
              <td>${formatRupiah(item.total_harga_barang)}</td>
            `;

              table.appendChild(row);
            });
          } else {
            table.innerHTML = `
            <tr>
              <td colspan="3" style="text-align:center;color:#94a3b8;">
                Tidak ada item terdeteksi
              </td>
            </tr>
          `;
          }

          document.getElementById("rawText").textContent = data.raw_text || "-";
          document.getElementById("classificationText").textContent =
            data.item_text_for_classification || "-";

          loader.style.display = "none";
          resultArea.style.display = "block";
          statusBadge.textContent = "Success";
        } catch (error) {
          loader.style.display = "none";
          emptyState.style.display = "block";
          emptyState.textContent = "Error: " + error.message;
          statusBadge.textContent = "Failed";
        } finally {
          uploadBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
